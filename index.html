<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Чек-лист смены</title>
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: sans-serif; padding: 16px; max-width: 500px; margin: 0 auto; background: #ffffff; color: #000000; }
    h2 { font-size: 18px; }
    .section { margin-bottom: 16px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
    .section h3 { font-size: 15px; margin-bottom: 8px; }
    label { display: block; margin: 6px 0; }
    input[type="number"], input[type="text"] { width: 80px; padding: 4px; }
    #signature-canvas { width: 100%; height: 120px; border: 1px solid #ccc; border-radius: 8px; touch-action: none; background-color: #ffffff; display: block; }
    button { padding: 10px 20px; font-size: 16px; margin-top: 10px; margin-right: 8px; border-radius: 8px; border: none; background: #2481cc; color: white; cursor: pointer; }
    button.clear { background: #999; }
  </style>
</head>
<body>

  <h2>Чек-лист сдачи смены</h2>
  <p>Дата: <input type="text" id="date" placeholder="__.__.____" style="width:120px;"></p>

  <div class="section">
    <h3>1. Касса</h3>
    <label>Наличные (руб.): <input type="number" id="cash" placeholder="0"></label>
    <label><input type="checkbox" id="cash-match"> Сумма совпадает с отчётом Langame</label>
  </div>

  <div class="section">
    <h3>2. Напитки (остатки)</h3>
    <label>Drive Me: <input type="number" id="driveme" placeholder="0"></label>
    <label>Evervess Cola: <input type="number" id="evervess" placeholder="0"></label>
    <label>Lipton Tea: <input type="number" id="lipton" placeholder="0"></label>
  </div>

  <div class="section">
    <h3>3. Оборудование</h3>
    <label><input type="checkbox" id="pc-ok"> Все ПК выключены, зависших нет</label>
    <label><input type="checkbox" id="periph-ok"> Периферия и провода на месте</label>
  </div>

  <div class="section">
    <h3>4. Уборка</h3>
    <label><input type="checkbox" id="clean-ok"> Столы, клавиатуры, мыши протёрты</label>
  </div>

  <div class="section">
    <h3>Подпись</h3>
    <canvas id="signature-canvas"></canvas>
    <button class="clear" id="clear-btn" type="button">Очистить</button>
  </div>

  <button id="submit-btn" type="button">Сдать смену</button>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      
      const canvas = document.getElementById('signature-canvas');
      const signaturePad = new SignaturePad(canvas, {
        backgroundColor: 'rgb(255, 255, 255)' 
      });

      document.getElementById('clear-btn').addEventListener('click', function() {
        signaturePad.clear();
      });

      document.getElementById('submit-btn').addEventListener('click', async function() {
        if (signaturePad.isEmpty()) {
          alert('Поставьте подпись пальцем');
          return;
        }
        
        const btn = document.getElementById('submit-btn');
        btn.innerText = "Отправка...";
        btn.disabled = true;

        // Получаем ID пользователя из Telegram
        const user = window.Telegram?.WebApp?.initDataUnsafe?.user;
        if (!user) {
            alert("Ошибка: не удалось получить данные пользователя Telegram.");
            btn.innerText = "Сдать смену"; btn.disabled = false;
            return;
        }

        // Делаем картинку с белым фоном
        const tempCanvas = document.createElement('canvas');
        tempCanvas.width = canvas.width;
        tempCanvas.height = canvas.height;
        const tempCtx = tempCanvas.getContext('2d');
        tempCtx.fillStyle = '#ffffff';
        tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);
        tempCtx.drawImage(canvas, 0, 0);
        
        const signatureDataURL = tempCanvas.toDataURL('image/jpeg', 0.5);
        // Превращаем Base64 в файл (Blob)
        const blob = await (await fetch(signatureDataURL)).blob();

        // Данные формы (без картинки)
        const data = {
          user_id: user.id,
          date: document.getElementById('date').value,
          cash: document.getElementById('cash').value,
          cash_match: document.getElementById('cash-match').checked,
          driveme: document.getElementById('driveme').value,
          evervess: document.getElementById('evervess').value,
          lipton: document.getElementById('lipton').value,
          pc_ok: document.getElementById('pc-ok').checked,
          periph_ok: document.getElementById('periph-ok').checked,
          clean_ok: document.getElementById('clean-ok').checked,
        };

        // ВАЖНО: Ссылка на ваш сервер (мы поднимем его на Python)
        const SERVER_URL = "https://subtitle-dangling-glimpse.ngrok-free.dev/api/upload";

        const formData = new FormData();
        formData.append('photo', blob, 'signature.jpg');
        formData.append('data', JSON.stringify(data));

        try {
            // Отправляем картинку на наш локальный сервер
            await fetch(SERVER_URL, { method: 'POST', body: formData });
            
            // Говорим Telegram закрыть окно
            Telegram.WebApp.close();
        } catch (e) {
            alert("Ошибка отправки на сервер. Проверьте, запущен ли bot.py");
            btn.innerText = "Сдать смену"; btn.disabled = false;
        }
      });
      
      if (window.Telegram && Telegram.WebApp) {
          Telegram.WebApp.ready();
      }
    });
  </script>
</body>
</html>
